{{define "student_form"}}
<form id="studentForm" hx-post="/partials/mahasiswa/students" hx-target="#studentFormShell" hx-swap="innerHTML">
  <div class="dialog-head">
    <div>
      <h2 id="studentDialogTitle">Daftarkan mahasiswa</h2>
      <p>Identitas tidak otomatis memiliki template wajah.</p>
    </div><button class="icon-button" type="button" id="closeStudentDialog" aria-label="Tutup"><i
        data-lucide="x"></i></button>
  </div>
  <div class="dialog-body">
    {{if .Error}}<p class="field-error" role="alert">{{.Error}}</p>{{end}}
    <label class="field">Nama lengkap<input name="name" required maxlength="120" autocomplete="name"
        placeholder="Nama mahasiswa" value="{{.Name}}"></label>
    <label class="field">NIM<input name="nim" required minlength="9" maxlength="9" pattern="[0-9]{9}" inputmode="numeric"
        title="9 digit angka, mis. 241011001" placeholder="241011001"
        value="{{.NIM}}"></label>
    <label class="field">Kelas<select name="classId" required>
        <option value="">Pilih kelas</option>
        {{range .Classes}}<option value="{{.ID}}" {{if eq .ID $.ClassID}}selected{{end}}>{{.Name}} ({{.ID}})</option>
        {{end}}
      </select></label>
  </div>
  <div class="dialog-foot"><button class="button" type="button" id="cancelStudentDialog">Batal</button><button
      class="button primary" type="submit"><i data-lucide="user-plus"></i>Simpan mahasiswa</button></div>
</form>
{{end}}
